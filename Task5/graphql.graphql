type Query {
    # Получить информацию о клиенте по ID
    client(id: ID!): Client

    # Получить список документов клиента
    clientDocuments(id: ID!): [Document]

    # Получить информацию о родственниках клиента
    clientRelatives(id: ID!): [Relative]
}

type Client {
    id: ID!
    name: String!
    age: Int!
}

type Document {
    id: ID!
    type: String!
    number: String!
    issueDate: String!
    expiryDate: String!
}

type Relative {
    id: ID!
    relationType: String!
    name: String!
    age: Int!
}